name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
      - name: End-to-end smoke test (clean log must pass, faulty log must fail)
        run: |
          python -m ee_toolkit simulate --faults none --out logs/clean.csv
          python -m ee_toolkit validate logs/clean.csv
          python -m ee_toolkit simulate --faults demo --out logs/demo.csv
          ! python -m ee_toolkit validate logs/demo.csv
